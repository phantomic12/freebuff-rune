[package]
name = "freebuff-rune"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Freebuff Desktop shell, rebuilt natively on Rune (no Electron)"

[dependencies]
rune = { path = "../vendor/rune/crates/rune", features = ["tooling"] }
# The orchestrator boot contract: an HMAC lifetime handshake (shell-lifetime.cjs) over loopback.
base64 = "0.22"
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"
