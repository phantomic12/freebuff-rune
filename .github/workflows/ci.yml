name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The bootstrap script is bash; GitHub's Windows runners default `run` to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  check:
    # The shell targets Windows first (custom caption buttons, %LOCALAPPDATA% paths). Linux and
    # macOS discovery is implemented but not exercised here yet.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Matches rust-toolchain.toml. `@stable` would drift past the pinned revision of Rune.
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'vendor/rune-rev.txt') }}

      # Rune is pre-release and consumed by revision, and the workspace's [patch.crates-io]
      # entries point into Rune's own vendored crates, so the clone must exist before building.
      - name: Fetch Rune at the pinned revision
        run: ./scripts/bootstrap-rune.sh

      - name: Format
        run: cargo fmt -p freebuff-rune -- --check

      - name: Clippy
        run: cargo clippy -p freebuff-rune --no-deps -- -D warnings

      - name: Tests
        run: cargo test -p freebuff-rune

      # The layout is checkable without a window, so the renders are too: a reviewer should be able
      # to look at the thing without building it. If the runner has no usable adapter this step is
      # the one that says so.
      - name: Build the binary
        run: cargo build -p freebuff-rune

      - name: Renders
        run: BIN=target/debug/freebuff-rune.exe OUT=renders ./scripts/shot.sh

      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/
          if-no-files-found: error

      # The live test spawns the installed app's orchestrator, which CI does not have. It stays
      # behind FREEBUFF_LIVE_TEST on purpose.
